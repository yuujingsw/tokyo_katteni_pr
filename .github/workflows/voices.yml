name: 声のオーディション（ElevenLabs）
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: tts
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/voices.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: save
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/voices && (git diff --cached --quiet || git commit -m "voices: audition [skip ci]") && git pull --rebase -q && git push
