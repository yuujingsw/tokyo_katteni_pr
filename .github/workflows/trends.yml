name: トレンド取得（読み取りのみ）
on:
  workflow_dispatch:
    inputs:
      tags:
        description: '追加で調べるハッシュタグ（カンマ区切り、#なし）'
        required: false
        default: ''
  schedule:
    - cron: '7 22 * * *'   # 毎朝 7:07 JST
permissions:
  contents: write
concurrency: trends
jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/trends.py "${{ github.event.inputs.tags }}"
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID || '17841435576448672' }}
      - name: save
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/trends && (git diff --cached --quiet || git commit -m "trends: $(date -u +%F) [skip ci]") && git pull --rebase -q && git push
